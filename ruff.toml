# V2.4 新增：ruff 配置（配合 .github/workflows/ci.yml 使用）
# 策略：只启用"确定性正确"的检查（语法错误 / 未定义名 / 无效转义），
# 不引入风格类规则，避免对既有 7000+ 行代码产生噪音。
line-length = 100
target-version = "py39"

[lint]
select = [
    "E9",   # 语法/缩进级错误（运行时必崩）
    "F63",  # 无效的比较/赋值（如 if x = 1）
    "F7",   # 注解里的语法错误
    "F82",  # 未定义名称（防"调用方未同步"类回归，如 V2.3 漏传 lock 的近亲问题）
]
