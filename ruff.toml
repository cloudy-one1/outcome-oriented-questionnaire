# V2.4 新增：ruff 配置（配合 .github/workflows/ci.yml 使用）
# 策略：只启用"确定性正确"的检查（语法错误 / 未定义名 / 无效转义 / 未使用名），
# 不引入格式风格类规则（E1-E5 缩进换行、W 系列、命名），避免对既有代码产生噪音。
# line-length 刻意不设：没有 E501 也没有 formatter 时它没有任何执行者 —— 等真
# 引入其中之一时再加回来，别让配置看起来管着其实没人管的东西。
# 测试文件里大量 `# noqa: E402` 注释对 ruff 同样无效（E402 未启用），但它们
# 标记的是"先塞 sys.path 再 import"这个刻意动作本身，留给人看，不清。
target-version = "py310"

[lint]
select = [
    "E9",   # 语法/缩进级错误（运行时必崩）
    "F63",  # 无效的比较/赋值（如 if x = 1）
    "F7",   # 注解里的语法错误
    "F82",  # 未定义名称（防"调用方未同步"类回归，如 V2.3 漏传 lock 的近亲问题）
    # V2.5 加入：F82 的近亲三兄弟。之所以值得开——它们是**零误报**的
    # "参数算了却没传"类 bug 的唯一自动化防线：
    # CLI --resume 静默失效（cli.py 算出 resume_fail 却不传 run_batch）
    # 就是 F841 一条规则就能在 CI 拦住的真实缺陷。
    "F401",  # 未使用的 import（防止"看着在用其实没接"）
    "F841",  # 赋值后从未使用的局部变量（--resume 类接线断裂的信号）
    "F541",  # 无占位符的 f-string（print 文案里的假 f-string）
]

