name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:

jobs:
  test:
    # 项目面向 Windows（Edge 驱动 / MessageBox 人工介入），与开发机保持一致。
    # 矩阵含 3.10：src/models.py 用了 @dataclass(slots=True)，3.10 是真实下限，
    # 只有一个 3.13 的 job 会让"最低支持版本"这句话永远不被验证。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 运行时 + 开发工具都钉版本（requirements-dev.txt），
        # 避免 pytest/ruff 上游发版把门禁口径悄悄改掉
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        # src/ + gui/ 都是 0 error 0 warning（v2.8 起 gui 纳入门禁、45 条清零），
        # 所以这里直接严格失败、不设 baseline。可选依赖的动态导入已改成
        # importlib + Any，未装 opencv / undetected-chromedriver 时也不会多出
        # import warning —— 这条 job 的结果不再依赖装了什么额外包。
        # 需要 Node 只为跑 pyright；GitHub runner 自带。
        uses: jakebailey/pyright-action@v2
        with:
          project: ./pyrightconfig.json

      - name: Run offline test suite + coverage ratchet
        # 覆盖率地板：只允许往上走。地板就是这条命令里的 `--cov-fail-under`，
        # 它是**手写数字里唯一还留在 CI 的**——README 的实测覆盖率由
        # scripts/readme_coverage.py 从 coverage.json 生成，并把这里的地板值一起抄进块里。
        # 抬高地板请只改这一处，README 下一次 --write 自动跟上。
        # 3.10 那条 leg 本机量不到，所以不抬地板（这台机器只有 3.11/3.12/3.13，
        # 抬到 73 也是拿没量过的环境赌门禁）。
        # 用 marker 而不是 --ignore 排除 E2E：该模块本来就会在缺浏览器时自 skip。
        # --cov 的三个包 = scripts/readme_coverage.py 的 PACKAGES，两边必须一致：
        # 漏一个的话新代码就静静落在门禁之外，而 README 的"全部"那一行看着挺健康。
        # webui/ 于 v3.3.1 步骤 3 进来（1214 句，本地量 99%），所以 TOTAL 会往上走 ——
        # 地板按"只许上调"的规矩仍不动。
        run: >
          pytest tests/ -m "not integration"
          --cov=src --cov=gui --cov=webui --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=70

      - name: README 覆盖率口径一致性
        # 只在 3.13 leg 上比：README 生成块的数字来自某一次真实运行，而两条 leg 的
        # 覆盖率本就允许不同（3.10 分支差异没人量过）。在没量过的 leg 上断言"数字必须
        # 等于 3.13 的实测"，等于把口径差异伪装成缺陷。
        if: matrix.python-version == '3.13'
        run: python scripts/readme_coverage.py --check

  # E2E 用真实浏览器跑 mock 问卷，是唯一能验证"生成的 JS 在真 DOM 里成立"的环节
  # —— selector 被误拼进 JS 字符串字面量这类**语法合法、语义非法**的错误，
  # node --check 与所有离线 mock 都看不见，只有真浏览器能抓到。
  # v3.1 起改为**阻塞**：浏览器/驱动自己起不来的那类失败由 tests/conftest.py 降级成
  # skip（不会红），剩下的红只剩"代码回归"一种解释。而"整片 skip"看着也是绿的这种
  # 假通过，由 scripts/e2e_gate.py 数 junit 的数字堵住。
  e2e:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run browser E2E
        run: pytest tests/ -m integration -v --junitxml=e2e-junit.xml

      - name: E2E 必须真的在浏览器里跑过
        # 全 skip 时 pytest 退出码仍是 0，这一条把"驱动没起来 => job 永远绿"堵死。
        # 退出码三态照 scripts/e2e_gate.py：0 通过 / 1 一条都没真跑 / 2 报告读不了
        run: python scripts/e2e_gate.py e2e-junit.xml
