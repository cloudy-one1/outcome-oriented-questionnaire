name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:

jobs:
  test:
    # 项目面向 Windows（Edge 驱动 / MessageBox 人工介入），与开发机保持一致。
    # 矩阵含 3.10：src/models.py 用了 @dataclass(slots=True)，3.10 是真实下限，
    # 只有一个 3.13 的 job 会让"最低支持版本"这句话永远不被验证。
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # 运行时 + 开发工具都钉版本（requirements-dev.txt），
        # 避免 pytest/ruff 上游发版把门禁口径悄悄改掉
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (pyright)
        # src/ 目前是 0 error 0 warning，所以这里直接严格失败、不设 baseline。
        # 需要 Node 只为跑 pyright；GitHub runner 自带。
        uses: jakebailey/pyright-action@v2
        with:
          project: ./pyrightconfig.json

      - name: Run offline test suite + coverage ratchet
        # 覆盖率地板：只允许往上走。当前实测 44%（见 README「开发与测试」），
        # 阈值定在 43 留一点余量；抬高数字后请同步改这里与 README。
        # 用 marker 而不是 --ignore 排除 E2E：该模块本来就会在缺浏览器时自 skip。
        run: >
          pytest tests/ -m "not integration"
          --cov=src --cov=gui --cov-report=term-missing
          --cov-fail-under=43

  # E2E 用真实浏览器跑 mock 问卷，是唯一能验证"生成的 JS 在真 DOM 里成立"的环节
  # —— selector 被误拼进 JS 字符串字面量这类**语法合法、语义非法**的错误，
  # node --check 与所有离线 mock 都看不见，只有真浏览器能抓到。
  # 作为非阻塞 job：浏览器驱动在 runner 上偶发启动失败，不该红掉主流程，
  # 但结果必须出现在 CI 页面上（此前是被 --ignore 完全关掉、彻底不可见）。
  e2e:
    needs: test
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run browser E2E (non-blocking)
        run: pytest tests/ -m integration -v
