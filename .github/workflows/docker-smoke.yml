name: Docker smoke

# Dockerfile 的唯一防线：只构建、只跑 `--help`，不发布、不推 registry。
#
# 为什么单独一个 workflow 而不是塞进 ci.yml：这个镜像只在"构建不构建得起来"
# 这一件事上有话说，挂进主 CI 会让每次 push 多花一两分钟装 chromium；
# 而完全不管它，CHANGELOG 里那句「Dockerfile 未在本仓库 CI 里构建过」就会
# 一直烂在那儿 —— 一条每周跑一次的定时任务正好把死文档变成活门禁。
#
# 它**不在** push 触发的必填检查里：镜像构建失败不该红掉一次正常的代码提交，
# 但结果必须留在 Actions 页面上（schedule 那一栏红了就看得见）。
on:
  schedule:
    - cron: "0 5 * * 1"  # 每周一 UTC 05:00
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t wjx-autofill:smoke .

      - name: Entrypoint smoke
        # ENTRYPOINT 是 wjx-fill：--help 退出码非 0 就说明控制台入口没装进去、
        # 或缺共享库、或 apt 那层版本对不上。这三类都是"镜像看着建好了其实跑不了"
        run: docker run --rm wjx-autofill:smoke --help

      - name: Import smoke
        # 绕过 ENTRYPOINT 直接 import 引擎链路，确认 pip install --no-deps . 真的
        # 把包连同 src/ 装进了镜像（漏 COPY 目录是最常见的一种自毁）。
        # 命令必须写在同一行：YAML 的 > 折叠标量对**更缩进**的续行保留换行与缩进，
        # 此前 print 那行缩得比上一行深，python 收到带缩进的第二行 →
        # IndentationError，本步骤自 2026-09-28 起连红四周（镜像与代码都没有问题，
        # 本地原样复跑同一条命令是通过的 —— 别再往镜像内容上找原因）。
        run: docker run --rm --entrypoint python wjx-autofill:smoke -c "import src.cli, src.pipeline, src.browser.driver_factory as m; print('import ok', m.__name__)"

      - name: Manifest must not contain private data
        # v4.2 全面审查 P1-8：白名单 COPY 的清单校验 —— 用无敏感内容的检查
        # 证明镜像里没有数据库 / 导出表格类文件。命令同样写在一行（教训同上）。
        # find 无命中时 grep 也无命中 → `&& exit 1` 不执行、`|| echo` 兜成 0；
        # 命中任何文件则 grep 退出 0 → `exit 1`，整步失败。
        # 注意回显文本里不能有 "冒号+空格"：这行是 YAML 纯量值，": " 是映射
        # 分隔符，写进去整个 workflow 解析失败（GitHub 上表现为 event=push、
        # conclusion=failure、jobs 为空的"幽灵 run"）—— 2026-10-29 实际踩过。
        run: docker run --rm --entrypoint sh wjx-autofill:smoke -c "find /app -name '*.db' -o -name '*.csv' -o -name '*.xlsx' -o -name '*.sqlite*' | grep . && exit 1 || echo 'manifest ok - no private data in image'"

      - name: Report image size
        run: docker image inspect wjx-autofill:smoke --format 'size={{.Size}} bytes'
